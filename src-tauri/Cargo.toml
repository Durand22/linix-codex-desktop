[package]
name = "codex-desktop"
version = "0.1.0"
description = "Native Linux desktop shell for Codex"
authors = ["Codex Desktop"]
edition = "2021"

[lib]
name = "codex_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-shell = "2"
thiserror = "2"
toml = "0.8"
dirs = "6"
notify = "8"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
